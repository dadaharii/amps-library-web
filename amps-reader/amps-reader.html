<!doctype html>
<html lang="en" data-theme="sepia">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AMPS Library</title>
  <meta name="theme-color" content="#e85d04" />
  <meta name="description" content="Premium Ananda Marga book library — read, search, highlight, note, study, play and reflect." />
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AMPS Library" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Noto+Sans+Devanagari&family=Noto+Serif+Devanagari:wght@400;600;700&family=Noto+Sans+Bengali&family=Noto+Sans+Oriya&family=Noto+Sans+Gurmukhi&family=Noto+Sans+Kannada&display=swap" />
  <style>
    :root {
      --gold: #c9a227;
      --gold-dim: rgba(201, 162, 39, 0.15);
      --gold-glow: rgba(201, 162, 39, 0.35);
      --radius: 8px;
      --radius-sm: 6px;
      --reader-size: 18px;
      --reader-lh: 1.75;
      --topbar-h: calc(52px + env(safe-area-inset-top, 0px));
      --nav-h: 64px;
      --shadow-soft: 0 10px 30px rgba(0,0,0,0.08);
      --shadow-strong: 0 18px 48px rgba(0,0,0,0.18);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    [data-theme="sepia"] {
      --bg: #f4ecd8; --surface: #faf6ec; --surface-2: #ebe3cf;
      --border: #d4c9a8; --text: #2c2416; --text-muted: #6b5d45;
      --hero-bg: linear-gradient(145deg, #2c2416 0%, #4a3728 45%, #1a1410 100%);
      --shloka-bg: #f0e6d0; --shloka-border: #8b6914; --shloka-roman: #3d2e1a;
      --shloka-dev: #5c3d1e; --shloka-bng: #6b2d5b;
      --shloka-or: #4a3d6b; --shloka-pa: #3d4a6b; --shloka-kn: #3d5a4a;
    }
    [data-theme="light"] {
      --bg: #f8f9fc; --surface: #fff; --surface-2: #eef1f8;
      --border: #dde2ef; --text: #1a1f2e; --text-muted: #5c6478;
      --hero-bg: linear-gradient(145deg, #1e3a5f, #2d4a6f, #0f172a);
      --shloka-bg: #f5f0e6; --shloka-border: #9a7b1c; --shloka-roman: #3a3020;
      --shloka-dev: #5c3d1e; --shloka-bng: #6b2d5b;
      --shloka-or: #4a3d6b; --shloka-pa: #3d4a6b; --shloka-kn: #3d5a4a;
    }
    [data-theme="dark"] {
      --bg: #0f1419; --surface: #1a222d; --surface-2: #242d3a;
      --border: #2e3a4a; --text: #e8ecf4; --text-muted: #8b95a8;
      --hero-bg: linear-gradient(145deg, #0a0e14, #1a222d, #000);
      --shloka-bg: #252018; --shloka-border: #c9a227; --shloka-roman: #e8dcc8;
      --shloka-dev: #e0c9a0; --shloka-bng: #d4a8c8;
      --shloka-or: #c8b8e0; --shloka-pa: #b8c8e0; --shloka-kn: #b8d8c8;
    }
    [data-theme="navy"] {
      --bg: #071426; --surface: #0d2036; --surface-2: #142b47;
      --border: #29445f; --text: #edf4fb; --text-muted: #a7b7c9;
      --hero-bg: linear-gradient(145deg, #071426, #12365a 55%, #0a1728);
      --shloka-bg: #10253d; --shloka-border: #c9a227; --shloka-roman: #f3ead4;
      --shloka-dev: #f0d9ad; --shloka-bng: #e0b8d4;
      --shloka-or: #d6c4ef; --shloka-pa: #c1d2ef; --shloka-kn: #c4e2d1;
    }
    [data-theme="contrast"] {
      --bg: #000; --surface: #111; --surface-2: #1a1a1a;
      --border: #fff; --text: #fff; --text-muted: #ccc;
      --hero-bg: linear-gradient(145deg, #000, #222, #000);
      --shloka-bg: #1a1a1a; --shloka-border: #ffcc00; --shloka-roman: #fff;
      --shloka-dev: #fff; --shloka-bng: #fff;
      --shloka-or: #fff; --shloka-pa: #fff; --shloka-kn: #fff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; width: 100%; max-width: 100%; overflow-x: hidden;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; color: inherit; max-width: 100%; min-width: 0; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    #app { min-height: 100vh; width: 100%; max-width: 100vw; overflow-x: clip; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 1rem; color: var(--text-muted); }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 0.5rem;
      height: var(--topbar-h); padding: env(safe-area-inset-top, 0px) 0.75rem 0;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      backdrop-filter: blur(18px) saturate(1.2);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 74%, transparent);
    }
    .topbar-title { flex: 1; font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn { width: 40px; height: 40px; border-radius: var(--radius-sm); font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn:active { transform: scale(0.96); }

    .main { width: 100%; max-width: 720px; min-width: 0; margin: 0 auto; padding: 0 1rem 2rem; }
    .main > * { max-width: 100%; min-width: 0; }
    .main-reader { max-width: none; padding: 0; }

    .hero {
      background: var(--hero-bg); color: #faf6ec;
      border-radius: var(--radius); padding: 1.75rem 1.5rem; margin: 1rem 0;
      box-shadow: var(--shadow-strong);
      position: relative; overflow: hidden;
    }
    .hero::after {
      content: ""; position: absolute; inset: auto 0 0 0; height: 5px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      pointer-events: none;
    }
    .hero-compact { padding: 1.25rem 1.25rem; }
    .hero-eyebrow { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; margin: 0 0 0.35rem; }
    .hero h1 { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif; font-size: 2rem; font-weight: 700; margin: 0; line-height: 1.15; }
    .hero-sub { margin: 0.5rem 0 0; opacity: 0.85; font-size: 0.88rem; line-height: 1.5; }

    .search-bar { display: flex; gap: 0.5rem; margin: 0.75rem 0 1rem; }
    .search-bar input {
      flex: 1; padding: 0.75rem 1rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface);
    }
    .search-bar input:focus { outline: 2px solid var(--gold-dim); border-color: var(--gold); }

    .section { margin-bottom: 1.5rem; }
    .section-head {
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); margin: 0 0 0.75rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .badge { background: var(--gold-dim); color: var(--gold); padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.7rem; }

    .book-grid { display: grid; gap: 0.65rem; }
    .book-card {
      display: flex; text-align: left; width: 100%; align-items: stretch;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .book-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .book-card-locked { opacity: 0.72; }
    .book-card-locked:hover { transform: none; }
    .pill-locked {
      display: inline-block;
      margin-top: 0.35rem;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      font-size: 0.72rem;
      background: #f3ebe3;
      color: #6b4a2e;
      border: 1px solid #e4d4c4;
    }
    .book-cover {
      flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-end;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.35);
      box-shadow: inset -3px 0 8px rgba(0,0,0,0.15);
    }
    .book-cover-card {
      width: 72px; min-height: 108px; padding: 0.5rem 0.4rem;
      border-radius: var(--radius-sm) 0 0 var(--radius-sm);
    }
    .book-cover-image { object-fit: cover; object-position: center; padding: 0; height: auto; aspect-ratio: 2 / 3; }
    .book-cover-hero {
      width: min(168px, 44vw); min-height: 240px; padding: 0.85rem 0.7rem;
      border-radius: var(--radius-sm);
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
      justify-content: flex-start;
    }
    .book-cover-series { font-size: 0.48rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.85; line-height: 1.2; }
    .book-cover-title { font-family: Georgia, Palatino, serif; font-size: 0.62rem; font-weight: 700; line-height: 1.25; flex: 1; }
    .book-cover-title-hero {
      font-size: clamp(0.68rem, 3.2vw, 0.82rem); line-height: 1.28; margin: 0.45rem 0 0.35rem;
      display: -webkit-box; -webkit-line-clamp: 7; line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden;
      flex: 1 1 auto; min-height: 0;
    }
    .book-cover-author {
      font-size: 0.52rem; line-height: 1.25; opacity: 0.92; margin-top: auto; flex-shrink: 0;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .book-cover-author-card {
      font-size: 0.42rem; margin-top: 0.25rem; opacity: 0.88; -webkit-line-clamp: 2; line-clamp: 2;
    }
    .book-cover-vol {
      font-size: 0.55rem; font-weight: 600; opacity: 0.92; margin-top: 0.35rem; flex-shrink: 0;
      letter-spacing: 0.02em;
    }
    .book-cover-card .book-cover-vol { font-size: 0.48rem; margin-top: 0.2rem; }
    .book-cover-prout {
      background:
        linear-gradient(180deg, rgba(255, 228, 170, 0.16), transparent 32%),
        radial-gradient(120% 80% at 100% 0%, rgba(196, 149, 72, 0.22), transparent 46%),
        linear-gradient(160deg, #5a2230 0%, #2a1018 52%, #14080c 100%);
      border: 1px solid rgba(232, 200, 114, 0.42);
      box-shadow: 0 16px 40px rgba(28, 10, 14, 0.42), inset 0 0 0 1px rgba(255, 220, 160, 0.1);
      justify-content: space-between;
      text-align: left;
      color: #f7efd8;
      text-shadow: none;
    }
    .book-cover-prout .book-cover-mark {
      font-size: 0.46rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #e8c872;
      opacity: 0.88;
    }
    .book-cover-prout .book-cover-title,
    .book-cover-prout .book-cover-title-hero {
      flex: 0 0 auto;
      color: #fbf3de;
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .book-cover-prout .book-cover-title-hero { margin: 0.55rem 0 0.2rem; -webkit-line-clamp: 4; line-clamp: 4; }
    .book-cover-prout .book-cover-rule {
      display: block; height: 1px; width: 46%;
      background: linear-gradient(90deg, #e8c872, transparent);
      margin: 0.35rem 0 0.45rem;
    }
    .book-cover-prout .book-cover-vol {
      color: #e8c872; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 0;
    }
    .book-cover-prout .book-cover-author { color: #f0e2c4; opacity: 1; }
    .hero-book-detail {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: 0.75rem; padding-bottom: 1.25rem;
    }
    .hero-cover-wrap { display: flex; justify-content: center; width: 100%; }
    .hero-book-meta { margin: 0; font-size: 0.82rem; }
    .hero-book-detail .hero-actions { justify-content: center; margin-top: 0.25rem; width: 100%; }
    .book-card-body { padding: 0.85rem 1rem; flex: 1; min-width: 0; }
    .book-card h3 { margin: 0 0 0.25rem; font-size: 0.95rem; font-weight: 600; line-height: 1.3; }
    .book-card p { margin: 0; font-size: 0.78rem; color: var(--text-muted); }
    .pill { display: inline-block; margin-top: 0.35rem; font-size: 0.7rem; background: var(--gold-dim); color: var(--gold); padding: 0.2rem 0.5rem; border-radius: 999px; }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; position: relative; z-index: 1; }
    .btn { padding: 0.65rem 1.1rem; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.88rem; }
    .btn-gold { background: linear-gradient(135deg, #d4af37, #a67c00); color: #1a1410; }
    .btn-ghost { background: rgba(255,255,255,0.12); color: inherit; border: 1px solid rgba(255,255,255,0.2); }
    .btn:active { transform: translateY(1px); }
    [data-theme="light"] .hero .btn-ghost, [data-theme="sepia"] .hero .btn-ghost { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.25); color: #faf6ec; }
    [data-theme="light"] .main .hero .btn-ghost { background: var(--surface-2); border-color: var(--border); color: var(--text); }
    .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.78rem; }
    .danger { color: #c0392b; }

    .toc-list, .disc-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .toc-item, .disc-item {
      display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left;
      padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .toc-item:hover, .disc-item:hover { border-color: var(--gold); background: var(--gold-dim); }
    .toc-num { font-weight: 700; color: var(--gold); min-width: 1.5rem; }
    .toc-part {
      margin: 1rem 0 0.35rem;
      padding: 0.35rem 0.25rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .toc-part:first-child { margin-top: 0; }
    .drawer-toc-part {
      margin: 0.75rem 0 0.25rem;
      padding: 0.25rem 0.65rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .toc-label { flex: 1; font-size: 0.9rem; }
    .toc-meta, .disc-item small { font-size: 0.75rem; color: var(--text-muted); }
    .disc-item { flex-wrap: wrap; }
    .disc-label { flex: 1; min-width: 12rem; font-size: 0.9rem; }
    .disc-item small { flex-basis: 100%; margin-top: 0.15rem; }

    .glossary-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .gloss-item { font-size: 0.88rem; line-height: 1.45; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    button.gloss-item { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--border); color: inherit; cursor: pointer; font: inherit; }
    button.gloss-item:hover { color: var(--gold); }
    .gloss-item strong { display: block; margin-bottom: 0.15rem; }
    .gloss-locs { margin-top: 0.65rem; display: flex; flex-direction: column; gap: 0.25rem; }
    .gloss-locs .toc-item { font-size: 0.85rem; }
    .gloss-entry-term { background: none; border: none; padding: 0; color: var(--gold); text-decoration: underline dotted; cursor: pointer; font: inherit; font-weight: 600; }
    .linkish { background: none; border: none; padding: 0; color: var(--gold); text-decoration: underline; cursor: pointer; font: inherit; }
    .muted { color: var(--text-muted); font-size: 0.85rem; }
    .pad { padding: 1rem; }

    /* Reader */
    .reader-toolbar-wrap {
      position: sticky; top: var(--topbar-h); z-index: 95;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .reader-toolbar-minimal .reader-toolbar-main {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.55rem;
    }
    .reader-toolbar-minimal .reader-toolbar-meta {
      min-width: 0;
      overflow: hidden;
      padding: 0 0.15rem;
    }
    .reader-chapter {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reader-eta {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      line-height: 1.2;
    }
    .reader-toolbar-minimal .reader-toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.15rem;
      flex-shrink: 0;
    }
    .reader-toolbar-minimal .reader-toolbar-btn {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      min-width: 38px;
      min-height: 38px;
      padding: 0;
      font-size: 0.95rem;
      line-height: 1;
      touch-action: manipulation;
      position: relative;
      z-index: 2;
    }
    .reader-toolbar-minimal .reader-toolbar-text {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .reader-toolbar-minimal .reader-toolbar-bookmark.active {
      color: var(--gold);
      background: var(--gold-dim);
      box-shadow: inset 0 0 0 2px var(--gold);
    }
    .reader-toolbar-minimal .reader-toolbar-listen.tts-on {
      background: var(--gold-dim);
      box-shadow: inset 0 0 0 2px var(--gold);
    }
    .reader-toolbar-minimal .reader-toolbar-stop {
      font-size: 0.85rem;
    }
    .reader-toolbar-minimal .reader-toolbar-stop.hidden {
      display: none;
    }
    .reader-audio-top-controls {
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0.55rem 0.5rem;
      border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
    }
    body.tts-reading .reader-audio-top-controls,
    body.tts-paused .reader-audio-top-controls {
      display: flex;
    }
    .reader-audio-dock {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
      z-index: 120;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.7rem;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(16px) saturate(1.2);
      border-top: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.1);
    }
    .reader-audio-mini {
      display: none;
      grid-template-columns: minmax(0, 1fr) auto;
    }
    body.tts-reading .reader-audio-dock,
    body.tts-paused .reader-audio-dock,
    body.tts-reading .reader-audio-mini,
    body.tts-paused .reader-audio-mini {
      display: grid;
    }
    .reader-para.is-tts-paragraph-active,
    .reader-para.tts-active {
      scroll-margin-top: calc(var(--reader-chrome-h, 120px) + 16px);
      scroll-margin-bottom: calc(7.5rem + env(safe-area-inset-bottom, 0px));
    }
    .reader-sheet-row.is-active {
      outline: 2px solid color-mix(in srgb, #c4a35a 55%, transparent);
      outline-offset: -2px;
    }
    .reader-audio-mini-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .reader-audio-mini-title {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reader-audio-mini-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reader-audio-mini-progress {
      height: 3px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
      margin-top: 0.2rem;
    }
    .reader-audio-mini-fill {
      height: 100%;
      width: 0;
      background: var(--gold);
      transition: width 0.25s ease;
    }
    .reader-audio-mini-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }
    .reader-audio-mini-actions .reader-audio-pill {
      min-width: 2.4rem;
      padding: 0.4rem 0.55rem;
    }
    .reader-audio-mini-actions .reader-audio-nav {
      min-width: 2.2rem;
      padding: 0.4rem 0.45rem;
    }
    body.tts-reading .reader-toolbar-wrap,
    body.tts-paused .reader-toolbar-wrap {
